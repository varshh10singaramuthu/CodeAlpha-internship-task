<!DOCTYPE html>
<html>
<head>
<title>ShopMart Login</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:40px;
    width:380px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

.logo{
    font-size:40px;
    margin-bottom:10px;
}

h1{
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

a{
    text-decoration:none;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">🛒</div>

<h1>ShopMart</h1>

<p>Login to continue shopping</p>

<form method="POST">

{% csrf_token %}

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<p>
New User?
<a href="/register/">
Create Account
</a>
</p>

</div>

</body>
</html>
