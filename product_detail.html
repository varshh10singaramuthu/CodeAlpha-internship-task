<!DOCTYPE html>
<html>
<head>
    <title>Product Detail</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .card {
            background: white;
            width: 700px;
            display: flex;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            padding: 20px;
        }

        .image {
            flex: 1;
            text-align: center;
        }

        .image img {
            width: 250px;
            border-radius: 10px;
        }

        .details {
            flex: 1;
            padding: 20px;
        }

        .details h1 {
            margin-top: 0;
        }

        .price {
            color: green;
            font-size: 22px;
            margin: 10px 0;
        }

        .desc {
            color: #555;
            margin-bottom: 20px;
        }

        .btn {
            background: orange;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: darkorange;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

<div style="
background:#222;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
">

<h2 style="color:white;margin:0;">
🛒 ShopMart
</h2>

<div>

<a href="/cart/"
style="color:white;margin-right:20px;">
Cart
</a>

<a href="/orders/"
style="color:white;margin-right:20px;">
Orders
</a>

<a href="/wishlist/"
style="color:white;margin-right:20px;">
Wishlist
</a>

<a href="/logout/"
style="color:white;">
Logout
</a>

</div>

</div>
<div style="
background:linear-gradient(135deg,#4facfe,#00f2fe);
padding:40px;
text-align:center;
color:white;
">

<h1>Welcome to ShopMart</h1>

<p>
Best Deals on Electronics, Fashion & More
</p>

</div>


<div class="container">
    <div class="card">

        <div class="image">
            <img src="{{ product.image }}">
        </div>

        <div class="details">
            <h1>{{ product.name }}</h1>

            <div class="price">₹{{ product.price }}</div>

            <div class="desc">
                {{ product.description }}
            </div>

            <a href="/add-to-cart/{{ product.id }}/">
    <button class="btn">Add to Cart</button>
</a>
<a href="/buy-now/{{ product.id }}/">
    <button style="background:orange;color:white;">
        Buy Now
    </button>
</a>
            <a href="/" class="back">⬅ Back to Home</a>
            <a href="/add-to-wishlist/{{ product.id }}/">
    <button style="background:red;color:white;">
        ❤️ Wishlist
    </button>
</a>
        </div>

    </div>
</div>

</body>
</html>
