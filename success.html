<!DOCTYPE html>
<html>
<head>
<title>Order Success</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#36d1dc,#5b86e5);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.icon{
    font-size:60px;
}

h1{
    margin-top:10px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#007bff;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.btn:hover{
    background:#0056b3;
}

</style>
</head>

<body>

<div class="box">

<div class="icon">🎉</div>

<h1>Order Placed Successfully!</h1>

<p>Your order has been placed.</p>

<a href="/" class="btn">Continue Shopping</a>

</div>

</body>
</html>
