<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
        }

        h1 {
            text-align: center;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100px;
            border-radius: 10px;
        }

        .details {
            flex: 1;
            margin-left: 20px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .total {
            text-align: right;
            font-size: 20px;
            margin-top: 20px;
        }

        .btn {
            background: orange;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            background: darkorange;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

<div class="navbar">
    🛒 Your Cart
</div>

<div class="container">

    <h1>Shopping Cart</h1>

    {% for product in products %}
    <div class="card">
        <img src="{{ product.image }}">

        <div class="details">
            <h3>{{ product.name }}</h3>
            <p class="price">₹{{ product.price }}</p>
        </div>
        <a href="/remove-from-cart/{{product.id}}/">
            <button class="btn">Remove</button>
        </a>
    </div>
    {% endfor %}

    <div class="total">
    <strong>Total Price: ₹{{ total }}</strong>
</div>


    <a href="/" class="back">⬅ Continue Shopping</a>
    <a href="/order/">
    <button>Place Order</button>
</a>

</div>

</body>
</html>
